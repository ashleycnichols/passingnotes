<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Passing Notes: notification keys</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; line-height: 1.5; color: #1c1b19; background: #f7f6f2; }
    h1 { font-size: 1.3rem; }
    label { display: block; font-weight: 600; margin: 18px 0 6px; }
    textarea { width: 100%; box-sizing: border-box; font: 13px ui-monospace, Menlo, monospace; padding: 10px; border: 1px solid #d8d3c8; border-radius: 10px; background: #fff; resize: none; }
    button { font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 10px; border: 1px solid #1c1b19; background: #1c1b19; color: #fff; cursor: pointer; }
    button.copy { background: #fff; color: #1c1b19; margin-top: 6px; }
    .note { background: #fff4e0; padding: 10px 12px; border-radius: 10px; font-size: 0.92rem; }
  </style>
</head>
<body>
  <h1>Notification keys</h1>
  <p>This makes a key pair for tag notifications. It runs only in this browser tab: nothing is sent or saved anywhere.</p>
  <button id="go">Generate keys</button>

  <div id="out" hidden>
    <label for="pub">Public key: goes in config.js and in Supabase as VAPID_PUBLIC_KEY</label>
    <textarea id="pub" rows="3" readonly></textarea>
    <button class="copy" data-for="pub">Copy public key</button>

    <label for="priv">Private key: goes ONLY in Supabase as VAPID_PRIVATE_KEY</label>
    <textarea id="priv" rows="2" readonly></textarea>
    <button class="copy" data-for="priv">Copy private key</button>

    <p class="note">Don't share the private key or put it in the repo. Once it's saved in Supabase you can close this tab; nothing needs to be kept here.</p>
  </div>

  <script>
    const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    document.getElementById('go').onclick = async () => {
      const pair = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
      const raw = await crypto.subtle.exportKey('raw', pair.publicKey);
      const jwk = await crypto.subtle.exportKey('jwk', pair.privateKey);
      document.getElementById('pub').value = b64url(raw);
      document.getElementById('priv').value = jwk.d;
      document.getElementById('out').hidden = false;
    };
    document.querySelectorAll('.copy').forEach((btn) => {
      btn.onclick = async () => {
        const t = document.getElementById(btn.dataset.for);
        t.select();
        try { await navigator.clipboard.writeText(t.value); } catch { document.execCommand('copy'); }
        btn.textContent = 'Copied';
        setTimeout(() => (btn.textContent = btn.dataset.for === 'pub' ? 'Copy public key' : 'Copy private key'), 1500);
      };
    });
  </script>
</body>
</html>
